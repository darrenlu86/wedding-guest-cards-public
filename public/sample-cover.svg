<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f0fff4"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#d4778a" stroke-width="3" opacity="0.45" rx="20"/>

  <!-- 四角 L 型裝飾，呼應卡片本體 CornerOrnament 風格 -->
  <g stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 90 130 L 90 90 L 130 90"/>
    <path d="M 1110 130 L 1110 90 L 1070 90"/>
    <path d="M 90 670 L 90 710 L 130 710"/>
    <path d="M 1110 670 L 1110 710 L 1070 710"/>
  </g>

  <!-- 中央菱形圖案，取代原本愛心 -->
  <g transform="translate(600, 320)" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 0 -40 L 40 0 L 0 40 L -40 0 Z"/>
    <path d="M 0 -22 L 22 0 L 0 22 L -22 0 Z"/>
    <circle cx="0" cy="0" r="4" fill="#c9a84c"/>
  </g>

  <line x1="380" y1="410" x2="820" y2="410" stroke="url(#divider)" stroke-width="1.5"/>

  <text x="600" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#7a3050" font-style="italic">Wedding Guest Cards</text>
  <text x="600" y="560" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" fill="#c9a84c" letter-spacing="6">A blessing card for every guest</text>
  <text x="600" y="640" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" fill="#6699cc" opacity="0.75">open-source template · replace this cover with your own image</text>
</svg>
